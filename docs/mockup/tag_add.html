<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>표 편집기 목업 - 태그 추가</title>
<link rel="stylesheet" href="mock.css">
<style>.win{height:620px}</style>
</head>
<body>
<h1>표 편집기 목업 · 태그 추가 팝업</h1>
<div class="win">
  <div class="title">표 편집기</div>
  <div class="dim">
    <div class="dlg">
      <div class="dh">태그 추가</div>
      <div class="db">
        <div class="frow"><label>태그</label><div class="box foc"><span class="mono">101-103, 110</span></div></div>
        <div class="frow"><label>프로파일</label><div class="box"><span class="tok">PF_BELT<u>✕</u></span><span class="tok">PF_LIFT<u>✕</u></span><span class="tok">PF_TRAY<u>✕</u></span><span class="tok add">+</span></div></div>
        <div class="frow"><label>본뜰 줄</label><span class="dd" style="justify-self:start;min-width:300px">9줄 · 태그 34 · PF_LIFT</span></div>
        <div class="frow"><label>연속 번호</label><span class="seg" style="margin-left:0;justify-self:start"><span class="on" style="width:88px">줄마다</span><span style="width:88px">범위 한 줄</span></span></div>
        <div class="frow" style="align-items:start"><label style="padding-top:6px">미리 보기</label>
          <div>
            <div class="mx">
              <div class="mr mh"><span>태그</span><span>PF_BELT</span><span>PF_LIFT</span><span>PF_TRAY</span></div>
              <div class="mr"><span>101</span><span class="new">새 줄</span><span class="new">새 줄</span><span class="new">새 줄</span></div>
              <div class="mr"><span>102</span><span class="new">새 줄</span><span class="new">새 줄</span><span class="new">새 줄</span></div>
              <div class="mr"><span>103</span><span class="new">새 줄</span><span class="has">있음</span><span class="new">새 줄</span></div>
              <div class="mr"><span>110</span><span class="new">새 줄</span><span class="new">새 줄</span><span class="new">새 줄</span></div>
            </div>
            <div class="sum" style="margin-top:8px"><span>새 줄 <b>11</b></span><span>있음 <b>1</b></span></div>
          </div>
        </div>
      </div>
      <div class="df"><span class="btn">취소</span><span class="btn pri">11줄 추가</span></div>
    </div>
  </div>
</div>
</body>
</html>
